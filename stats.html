<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Visits — abhilashcr.in</title>
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #0a0b10; --card: #141821; --line: rgba(255,255,255,.08); --text: #f3f4f7; --muted: #a3a9b8; --sky: #4cc3e6; --ember: #ffb43a; --fire: #ff6a13; color-scheme: dark; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; font-family: "Noto Sans", system-ui, sans-serif; background: var(--ink); color: var(--text); line-height: 1.5; }
    main { max-width: 1040px; margin: 0 auto; padding: calc(32px + env(safe-area-inset-top, 0px)) 16px calc(48px + env(safe-area-inset-bottom, 0px)); padding-inline: clamp(16px, 4vw, 40px); }
    h1 { margin: 0 0 4px; font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800; text-transform: uppercase; }
    .sub { margin: 0 0 28px; color: var(--muted); }
    a { color: var(--sky); }
    form { display: flex; gap: 10px; flex-wrap: wrap; max-width: 520px; }
    input { flex: 1 1 220px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; }
    button { padding: 12px 18px; border-radius: 10px; border: 0; background: var(--ember); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .msg { margin: 12px 0 0; color: var(--fire); min-height: 1.5em; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .tile { padding: 16px 18px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
    .tile b { display: block; font-size: 2rem; line-height: 1.1; color: var(--ember); font-variant-numeric: tabular-nums; }
    .tile span { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
    section { padding: 18px 20px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); min-width: 0; }
    h2 { margin: 0 0 12px; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--sky); }
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
    th:last-child:not(:first-child) { text-align: right; }
    td.n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
    .bar { height: 4px; border-radius: 2px; background: var(--sky); opacity: .7; margin-top: 4px; }
    .empty { color: var(--muted); }
    .toolbar { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Visits</h1>
    <p class="sub">Private report for <a href="/">abhilashcr.in</a>. Location is approximate (city level), based on Vercel's network data.</p>

    <form id="login">
      <input id="key" type="password" placeholder="Stats key" autocomplete="current-password" required>
      <button type="submit">View</button>
    </form>
    <p class="msg" id="msg" role="status"></p>

    <div id="report" hidden>
      <div class="toolbar">
        <span class="sub" id="updated" style="margin:0"></span>
        <span>
          <button class="ghost" id="refresh" type="button">Refresh</button>
          <button class="ghost" id="logout" type="button">Lock</button>
        </span>
      </div>
      <div class="tiles" id="tiles"></div>
      <div class="grid">
        <section><h2>Visits by city</h2><div class="scroll"><table id="cities"></table></div></section>
        <section><h2>By country</h2><div class="scroll"><table id="countries"></table></div></section>
        <section><h2>Recent visits</h2><div class="scroll"><table id="recent"></table></div></section>
        <section><h2>Last 30 days</h2><div class="scroll"><table id="days"></table></div></section>
      </div>
    </div>
  </main>

  <script>
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var fmt = new Intl.NumberFormat();
    var KEY = "acr-stats-key";

    function store(v) { try { v === null ? sessionStorage.removeItem(KEY) : sessionStorage.setItem(KEY, v); } catch (e) {} }
    function saved() { try { return sessionStorage.getItem(KEY); } catch (e) { return null; } }

    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

    function rows(el, head, data, render) {
      if (!data.length) { el.innerHTML = '<tr><td class="empty">No visits yet.</td></tr>'; return; }
      el.innerHTML = "<tr>" + head.map(function (h) { return "<th>" + h + "</th>"; }).join("") + "</tr>" + data.map(render).join("");
    }

    function show(d) {
      var top = d.cities[0] ? d.cities[0].visits : 1;
      var today = new Date().toISOString().slice(0, 10);
      var todayRow = d.days.filter(function (r) { return r.name === today; })[0];

      $("tiles").innerHTML = [
        ["Total visits", d.total],
        ["Today (UTC)", todayRow ? todayRow.visits : 0],
        ["Cities", d.cities.length],
        ["Countries", d.countries.length]
      ].map(function (t) { return '<div class="tile"><b>' + fmt.format(t[1]) + "</b><span>" + t[0] + "</span></div>"; }).join("");

      rows($("cities"), ["City", "Visits"], d.cities, function (r) {
        return "<tr><td>" + esc(r.name) + '<div class="bar" style="width:' + Math.max(4, r.visits / top * 100) + '%"></div></td><td class="n">' + fmt.format(r.visits) + "</td></tr>";
      });
      rows($("countries"), ["Country", "Visits"], d.countries, function (r) {
        return "<tr><td>" + esc(r.name) + '</td><td class="n">' + fmt.format(r.visits) + "</td></tr>";
      });
      rows($("days"), ["Date", "Visits"], d.days, function (r) {
        return "<tr><td>" + esc(r.name) + '</td><td class="n">' + fmt.format(r.visits) + "</td></tr>";
      });
      rows($("recent"), ["When", "Place"], d.recent, function (r) {
        var when = new Date(r.t).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
        return "<tr><td>" + esc(when) + "</td><td>" + esc([r.city, r.region, r.country].filter(Boolean).join(", ")) + "</td></tr>";
      });

      $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
      $("login").hidden = true;
      $("report").hidden = false;
    }

    function load(key) {
      $("msg").textContent = "Loading…";
      return fetch("/api/stats", { headers: { Authorization: "Bearer " + key }, cache: "no-store" })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
        .then(function (r) {
          if (!r.ok) throw new Error(r.body.error || "Request failed");
          store(key);
          $("msg").textContent = "";
          show(r.body);
        })
        .catch(function (e) {
          store(null);
          $("report").hidden = true;
          $("login").hidden = false;
          $("msg").textContent = e.message;
        });
    }

    $("login").addEventListener("submit", function (e) { e.preventDefault(); load($("key").value.trim()); });
    $("refresh").addEventListener("click", function () { var k = saved(); if (k) load(k); });
    $("logout").addEventListener("click", function () { store(null); $("key").value = ""; $("report").hidden = true; $("login").hidden = false; });

    var k = saved();
    if (k) load(k);
  })();
  </script>
</body>
</html>
